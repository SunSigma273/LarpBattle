<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LarpBattle</title><style>
*{box-sizing:border-box}body{margin:0;background:#101326;color:#f6f4ff;font:16px system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{font-size:clamp(32px,7vw,60px);color:#ffcf56;margin:12px 0}button,input{font:inherit;padding:12px;border-radius:10px;border:2px solid #626b91;background:#202746;color:white;margin:4px}button{cursor:pointer;font-weight:700}button:hover{background:#38436c}.primary{background:#db3267;border-color:#db3267}.panel{background:#191e39;border:1px solid #3d456b;border-radius:16px;padding:18px;margin:14px 0}.hidden{display:none}.fighters{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.fighter{min-height:70px;background:#282f51}.fighter.sel{outline:3px solid #ffcf56}canvas{width:100%;height:auto;background:#c2d4ee;border-radius:12px;image-rendering:pixelated}.muted{color:#b8c2e6}#status{white-space:pre-wrap;color:#ffdc83;min-height:24px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body><main><div class="muted">PIXEL FIGHTER · 1v1</div><h1>LarpBattle</h1><p>Chọn đấu với máy hoặc tạo phòng để thách đấu bạn bè.</p><section class="panel" id="menu"><div class="row"><button class="primary" id="offline">Đánh offline</button><button id="showOnline">Đánh online</button><button id="soundToggle" type="button" aria-pressed="true">Âm thanh: bật</button></div><p class="muted">Điều khiển: A/D hoặc ←/→ di chuyển · J đánh · K kỹ năng</p></section><section class="panel hidden" id="online"><h2>Phòng online</h2><input id="name" maxlength="20" placeholder="Tên người chơi"><div class="row"><button id="create" class="primary">Tạo phòng</button><input id="code" maxlength="6" placeholder="Mã 6 số" inputmode="numeric"><button id="join">Vào phòng</button></div><p id="roomInfo"></p><button id="ready">Sẵn sàng / Bắt đầu</button><button id="back">Quay lại</button></section><section class="panel hidden" id="game"><div class="row"><b id="modeLabel">Trận đấu</b><span id="hp"></span><button id="restart">Chơi lại</button><button id="menuBtn">Menu</button></div><canvas id="arena" width="800" height="360"></canvas><p class="muted">A/D hoặc ←/→ di chuyển · J đánh thường · K kỹ năng</p><div id="pick" class="fighters"></div></section><section class="panel"><h3>10 đấu sĩ</h3><div class="fighters" id="roster"></div></section><div id="status"></div></main><script>
const names=['Kid','Adult','Sun','Ben','Dumb','Elsu','Butterfly','Bacon','Steve','Dragon'],colors=['#ee6b70','#4b75d1','#ffb52e','#60c8a1','#9a81d6','#6a9ce8','#ed6eaf','#f0c58b','#4dbb70','#e85d37'];let selected='Kid',mode='offline',x=[150,650],hp=[100,100],keys={},sock=null,seat=0,room='',online=false,ready=false,attack=0;
const $=id=>document.getElementById(id);
let audioContext=null,soundEnabled=true,soundManifest={assets:{}};
fetch('/sfx/manifest.json').then(r=>r.ok?r.json():null).then(m=>{if(m&&m.assets)soundManifest=m}).catch(()=>{});
function synthSfx(type){
  if(!soundEnabled)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioContext ||= new AC();if(audioContext.state==='suspended')audioContext.resume();
    const now=audioContext.currentTime,osc=audioContext.createOscillator(),gain=audioContext.createGain();
    const presets={'ui-click':[520,760,0.065,'sine'],'ui-confirm':[460,880,0.16,'triangle'],'magic':[260,1050,0.28,'sine'],'impact-soft':[170,72,0.12,'triangle']};
    const p=presets[type]||presets['ui-click'];osc.type=p[3];osc.frequency.setValueAtTime(p[0],now);osc.frequency.exponentialRampToValueAtTime(Math.max(35,p[1]),now+p[2]);
    gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.075,now+0.012);gain.gain.exponentialRampToValueAtTime(0.0001,now+p[2]);
    osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+p[2]+0.015);
  }catch(e){/* Audio is optional; never interrupt gameplay. */}
}
function playSfx(type){
  if(!soundEnabled)return;
  const asset=(soundManifest.assets||{})[type];
  if(asset&&asset.file){
    const audio=new Audio(asset.file);audio.volume=0.32;
    audio.play().catch(()=>synthSfx(type));
  }else synthSfx(type);
}
$('soundToggle')?.addEventListener('click',()=>{soundEnabled=!soundEnabled;$('soundToggle').textContent='Âm thanh: '+(soundEnabled?'bật':'tắt');$('soundToggle').setAttribute('aria-pressed',String(soundEnabled));if(soundEnabled)playSfx('ui-confirm');});
document.addEventListener('click',e=>{if(e.target.closest('button')&&e.target.closest('button').id!=='soundToggle')playSfx('ui-click')});
function status(s){$('status').textContent=s}function show(id){['menu','online','game'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}
function drawRoster(){ $('roster').innerHTML=names.map((n,i)=>'<button class="fighter '+(n===selected?'sel':'')+'" data-char="'+n+'">▰ '+n+'</button>').join('');$('pick').innerHTML=$('roster').innerHTML;document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{selected=b.dataset.char;playSfx('ui-confirm');drawRoster();if(sock&&sock.readyState===1)sock.send(JSON.stringify({type:'select',character:selected}));});}
function draw(){let c=$('arena'),ctx=c.getContext('2d');ctx.fillStyle='#c2d4ee';ctx.fillRect(0,0,800,360);ctx.fillStyle='#8da4c7';ctx.fillRect(0,290,800,70);for(let i=0;i<2;i++){ctx.fillStyle=colors[names.indexOf(i===0?(online&&seat===1?'Adult':selected):'Dragon')];ctx.fillRect(x[i],220,48,70);ctx.fillStyle='#202746';ctx.fillRect(x[i]+8,235,8,8);ctx.fillRect(x[i]+30,235,8,8);ctx.fillStyle='#df5264';ctx.fillRect(30+i*400,25,340,18);ctx.fillStyle='#5be0a4';ctx.fillRect(30+i*400,25,340*hp[i]/100,18);ctx.fillStyle='#18203b';ctx.font='16px system-ui';ctx.fillText(i===0?(online?'Player '+(seat+1):selected):'Opponent',30+i*400,18);}requestAnimationFrame(draw)}
function start(m){playSfx('ui-confirm');mode=m;show('game');$('modeLabel').textContent=m==='offline'?'Đấu với máy':'Đấu online · '+room;hp=[100,100];x=[150,650];}
$('offline').onclick=()=>{online=false;start('offline');status('Đang chơi offline.');};$('showOnline').onclick=()=>{show('online');status('Tạo phòng hoặc nhập mã phòng của bạn bè.');};$('back').onclick=()=>show('menu');
function connect(){if(sock&&sock.readyState===1)return Promise.resolve();return new Promise((resolve,reject)=>{let proto=location.protocol==='https:'?'wss:':'ws:';sock=new WebSocket(proto+'//'+location.host);sock.onopen=resolve;sock.onerror=()=>reject(Error('Không kết nối được máy chủ online'));sock.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){status(m.message);return}if(m.type==='joined'){playSfx('ui-confirm');seat=m.seat;room=m.code;$('roomInfo').textContent='Mã phòng: '+room+' — gửi mã này cho bạn bè.';$('code').value=room;start('online');}if(m.type==='state'){if(m.players){m.players.forEach((p,i)=>{if(p){if(hp[i]>p.hp)playSfx('impact-soft');x[i]=p.x;hp[i]=p.hp}});$('roomInfo').textContent='Phòng '+m.code+' · '+m.players.map(p=>p?p.name+(p.ready?' ✓':''):'Đang chờ người chơi').join(' vs ');if(m.winner!==null&&m.winner!==undefined)status(m.winner===-1?'Hòa!':m.winner===seat?'Bạn thắng!':'Bạn thua!');}}if(m.type==='countdown')status('Chọn nhân vật! Bắt đầu sau 20 giây.');if(m.type==='notice')status(m.message);};});}
$('create').onclick=async()=>{try{await connect();sock.send(JSON.stringify({type:'create',name:$('name').value||'Player'}));online=true;}catch(e){status(e.message)}};
$('join').onclick=async()=>{try{await connect();sock.send(JSON.stringify({type:'join',code:$('code').value.trim(),name:$('name').value||'Player'}));online=true;}catch(e){status(e.message)}};
$('ready').onclick=()=>{if(sock&&sock.readyState===1)sock.send(JSON.stringify({type:'ready',ready:true}));};$('restart').onclick=()=>{if(online&&sock)sock.send(JSON.stringify({type:'rematch'}));else{hp=[100,100];x=[150,650];status('Trận mới bắt đầu!')}};
$('menuBtn').onclick=()=>show('menu');window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
setInterval(()=>{if(!online){if(keys.a||keys.arrowleft)x[0]=Math.max(0,x[0]-5);if(keys.d||keys.arrowright)x[0]=Math.min(750,x[0]+5);if((keys.j||keys.k)&&Math.abs(x[0]-x[1])<100&&attack<Date.now()){hp[1]=Math.max(0,hp[1]-8);playSfx('impact-soft');attack=Date.now()+450;if(hp[1]===0){playSfx('ui-confirm');status('Bạn thắng! Nhấn Chơi lại.')}}if(Math.random()<.04)x[1]+=Math.random()<.5?-8:8;}else if(sock&&sock.readyState===1&&room){sock.send(JSON.stringify({type:'input',dx:(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),attack:!!(keys.j||keys.k)}));}},50);
drawRoster();draw();
</script></body></html>
